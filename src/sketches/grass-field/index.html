<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grass Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: monospace; font-size: 12px; color: #fff; }
    canvas { display: block; }

    #fpsContainer {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.55);
      padding: 8px 10px;
      z-index: 10;
      min-width: 110px;
      line-height: 1.7;
    }
    .fpsInner { display: flex; gap: 10px; margin-bottom: 2px; }
    .clickable { cursor: pointer; }
    .clickable:hover { text-decoration: underline; }

    #uiContainer {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.65);
      padding: 8px 10px;
      z-index: 10;
      width: 230px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .slider-row { margin-bottom: 5px; }
    .label-row { display: flex; justify-content: space-between; margin-bottom: 1px; }
    .label-row span:last-child { color: #aef; }
    input[type=range] { width: 100%; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="fpsContainer">
  <div class="fpsInner">
    <div class="fps">fps: <span id="fps">0</span></div>
  </div>
  <div>Grass</div>
  <div class="clickable" id="setCount0" style="color:red;">1</div>
  <div class="clickable" id="setCount1">a few</div>
  <div class="clickable" id="setCount2">some</div>
  <div class="clickable" id="setCount3">many</div>
  <div>
    <span class="clickable" id="setCount4">lots</span>
    <span style="float:right" class="clickable" id="advanced">*</span>
  </div>
</div>

<div id="uiContainer" style="display:none"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
