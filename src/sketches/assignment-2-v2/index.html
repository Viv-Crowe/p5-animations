<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otolith</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      /* fluid canvas sits behind everything */
      #fluid-canvas {
        display: block;
        position: fixed;
        top: 0; left: 0;
        z-index: 0;
      }

      /* p5 canvas floats on top, transparent */
      body > canvas:not(#fluid-canvas) {
        display: block;
        position: fixed;
        top: 0; left: 0;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <!-- dli/fluid globals — must load in order before the module -->
    <script src="./fluid/wrappedgl.js"></script>
    <script src="./fluid/utilities.js"></script>
    <script src="./fluid/camera.js"></script>
    <script src="./fluid/boxeditor.js"></script>
    <script src="./fluid/simulator.js"></script>
    <script src="./fluid/renderer.js"></script>
    <script src="./fluid/simulatorrenderer.js"></script>

    <script type="module" src="./main.js"></script>
  </body>
</html>
